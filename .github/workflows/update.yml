name: Update IPTV Playlist

on:
  schedule:
    - cron: '0 */6 * * *' # Executa a cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch: # Permite execução manual na aba "Actions" do GitHub

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update script
        run: python main.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add playlist.m3u8 state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update playlist and state" && git push)